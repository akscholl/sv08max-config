##########################################################
#  SV08 Max calibration helpers (stock Sovol firmware)
##########################################################

[gcode_macro CHAMBER_SOAK]
description: Heat bed and chamber, wait for chamber, optional timed soak. Does nothing if CHAMBER=0
# ---------- EDIT THESE (from guide step A4) ----------
variable_heater_name: "Chamber_Heater"
variable_sensor_name: "temperature_sensor Chamber_Temp"
variable_use_m141: False
variable_soak_minutes: 30
# ------------------------------------------------------
gcode:
  {% set cfg = printer["gcode_macro CHAMBER_SOAK"] %}
  {% set target = [params.CHAMBER|default(0)|float, 60.0]|min %}
  {% set soak = params.SOAK|default(cfg.soak_minutes)|int %}
  {% set bed = params.BED|default(0)|float %}
  {% if target > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT=10800
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    G90
    G1 X250 Y250 Z50 F6000
    CHAMBER_SET TEMP={target}
    {% if bed > 0 %}
      M140 S{bed}
      _SAY MSG="Heating bed to {bed|int} C"
      TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
    {% endif %}
    _SAY MSG="Waiting for chamber to reach {target|int} C"
    TEMPERATURE_WAIT SENSOR="{cfg.sensor_name}" MINIMUM={target - 2}
    _SAY MSG="Chamber at temperature. Soaking {soak} minutes"
    {% for i in range(soak) %}
      G4 P60000
    {% endfor %}
    _SAY MSG="Soak complete"
  {% endif %}

[gcode_macro CHAMBER_SET]
description: Set the chamber heater target without waiting. TEMP=0 turns it off
gcode:
  {% set cfg = printer["gcode_macro CHAMBER_SOAK"] %}
  {% set t = [params.TEMP|default(0)|float, 60.0]|min %}
  {% if cfg.use_m141 %}
    M141 S{t}
  {% else %}
    SET_HEATER_TEMPERATURE HEATER={cfg.heater_name} TARGET={t}
  {% endif %}

[gcode_macro SOAK_DRIFT_LOG]
description: Level and probe bed centre every few minutes to measure warm-up drift
gcode:
  {% set checks = params.CHECKS|default(12)|int %}
  {% set every = params.EVERY|default(5)|int %}
  SET_IDLE_TIMEOUT TIMEOUT=14400
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  {% for i in range(checks) %}
    QUAD_GANTRY_LEVEL
    G1 X270 Y250 Z10 F6000
    PROBE
    _LOG_PROBE N={i + 1} MIN={i * every}
    G1 Z30 F600
    {% if i < checks - 1 %}
      G4 P{every * 60000}
    {% endif %}
  {% endfor %}
  _SAY MSG="Drift log finished"

[gcode_macro _LOG_PROBE]
gcode:
  {% set s = printer["gcode_macro CHAMBER_SOAK"].sensor_name %}
  {% set ch = printer[s].temperature if s in printer else 0 %}
  {action_respond_info("DRIFT check %s at %s min: probe Z = %.4f  chamber = %.1f C  bed = %.1f C" % (params.N, params.MIN, printer.probe.last_z_result, ch, printer.heater_bed.temperature))}

[gcode_macro SKIP_TEST]
description: Fast XY moves between two homings; compare BEFORE/AFTER mcu step counts
gcode:
  {% set speed = params.SPEED|default(300)|float %}
  {% set accel = params.ACCEL|default(10000)|float %}
  {% set loops = params.LOOPS|default(10)|int %}
  {% set old_v = printer.toolhead.max_velocity %}
  {% set old_a = printer.toolhead.max_accel %}
  {% set old_mcr = printer.toolhead.minimum_cruise_ratio|default(0.5) %}
  {% set f = speed * 60 %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 Z30 F600
  G28 X Y
  M400
  _SAY MSG="BEFORE:"
  GET_POSITION
  SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO=0.5
  {% for i in range(loops) %}
    G1 X50 Y50 F{f}
    G1 X450 Y450 F{f}
    G1 X50 Y450 F{f}
    G1 X450 Y50 F{f}
    G1 X50 Y250 F{f}
    G1 X450 Y250 F{f}
    G1 X250 Y50 F{f}
    G1 X250 Y450 F{f}
  {% endfor %}
  SET_VELOCITY_LIMIT VELOCITY={old_v} ACCEL={old_a} MINIMUM_CRUISE_RATIO={old_mcr}
  G1 X250 Y250 F6000
  M400
  G28 X Y
  M400
  _SAY MSG="AFTER:"
  GET_POSITION
  _SAY MSG="Compare stepper_x and stepper_y on the two mcu: lines"

[gcode_macro Z_SPEED_TEST]
description: Level, cycle Z at a test speed, level again to detect slip
gcode:
  {% set speed = params.SPEED|default(10)|float %}
  {% set cycles = params.CYCLES|default(10)|int %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  QUAD_GANTRY_LEVEL
  G28 Z
  G90
  G1 X250 Y250 Z20 F6000
  _SAY MSG="Z test at {speed} mm/s (capped by max_z_velocity)"
  {% for i in range(cycles) %}
    G1 Z200 F{speed * 60}
    G1 Z20 F{speed * 60}
  {% endfor %}
  _SAY MSG="Final leveling - check its adjustments"
  QUAD_GANTRY_LEVEL

[gcode_macro _SAY]
gcode:
  {action_respond_info(params.MSG|default(""))}

[gcode_macro SAY_HELLO]
gcode:
  _SAY MSG="Calibration macros installed."